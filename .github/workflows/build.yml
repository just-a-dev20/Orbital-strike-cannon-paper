name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (leave empty for a normal build)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    # Branches of this repository already build on push, so pull requests only need their own run from forks.
    if: >-
      github.ref_type != 'tag' && !inputs.version
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    # A newer push to the same branch or pull request supersedes a running build; the default branch builds every commit.
    concurrency:
      group: build-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew build

      # A full artifact storage quota of the account must not turn a successful build red.
      - name: Upload plugin jar
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: OrbitalRailgun
          path: build/libs/OrbitalRailgun-*.jar
          if-no-files-found: error
          retention-days: 14

  # Publishes a GitHub release with the jar, either for a pushed tag like v1.2.0 or for a manual run with a
  # version (the tag is then created on the commit that was built). Release files do not count towards the
  # artifact storage quota.
  release:
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || inputs.version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#v}"; else version="${INPUT_VERSION#v}"; fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version '$version', expected something like 1.0.0"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew build -PpluginVersion="$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/OrbitalRailgun-$VERSION.jar"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$jar" --clobber
          else
            gh release create "$TAG" "$jar" --target "$GITHUB_SHA" --title "Orbital Railgun $TAG" --generate-notes
          fi
