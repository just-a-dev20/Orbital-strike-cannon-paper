name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle dependencies and validates the Gradle wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew build

      # A full artifact storage quota of the account must not turn a successful build red.
      - name: Upload plugin jar
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: OrbitalRailgun
          path: build/libs/OrbitalRailgun-*.jar
          if-no-files-found: error
          retention-days: 14
