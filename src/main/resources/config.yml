# Orbital Railgun – Konfiguration
# Die Standardwerte entsprechen dem Original-Mod von Mishkis.
# Zeiten sind in Ticks angegeben (20 Ticks = 1 Sekunde).

# Sprache der Texte für Spieler ohne Resource-Pack (Dateien unter lang/ im Plugin-Jar),
# z. B. en_us oder de_de. Mit Resource-Pack übersetzt der Client selbst.
language: en_us

strike:
  # Radius des Zylinders, der zerstört wird, und der Schadenszone (Original: 24, erlaubt: 1–64).
  radius: 24
  # Zeit vom Schuss bis zum Einschlag (Original: 700 Ticks = 35 s).
  charge-ticks: 700
  # Abklingzeit nach dem Schuss (Original: 2400 Ticks = 120 s).
  cooldown-ticks: 2400
  # Maximale Zielentfernung in Blöcken (Original: 300).
  max-range: 300
  # Welten, in denen die Railgun funktioniert. Leere Liste = alle Welten.
  allowed-worlds: []
  # Sog in Richtung Zentrum in den letzten 15 s vor dem Einschlag.
  pull: true

damage:
  enabled: true
  # Original: 100000 (tödlich für alles außer Kreativ-/Zuschauer-Spielern und Resistenz V).
  amount: 100000
  # false = wie im Original ohne Angreifer (PvP-Schutz greift nicht).
  # true  = der Schütze gilt als Angreifer; PvP-Regeln von Schutz-Plugins greifen.
  attribute-to-shooter: false

destruction:
  enabled: true
  destroy-bedrock: true
  # Blöcke, die nie entfernt werden (Material-Namen, z. B. [BARRIER, END_PORTAL_FRAME]).
  skip-blocks: []
  # Obergrenze der geprüften Blöcke pro Tick über alle laufenden Angriffe.
  blocks-per-tick: 20000
  # Zeitbudget pro Tick in Millisekunden. Wird es überschritten, drosselt das Plugin automatisch.
  max-millis-per-tick: 10

protection:
  # Vor jedem Abbau-Paket ein EntityExplodeEvent (Schütze als Quelle) auslösen,
  # damit WorldGuard, GriefPrevention, CoreProtect & Co. greifen.
  fire-explode-events: true

effects:
  enabled: true
  # Spieler in diesem Umkreis (Blöcke) sehen und hören den Angriff.
  view-distance: 256
  # Faktor für die Partikelmenge (0 = keine Partikel).
  particle-multiplier: 1.0
  # Abdunkeln während des Aufladens (Darkness-Effekt).
  darkness: true
  # Kurzes Schwarzblenden kurz nach dem Schuss (Blindness-Effekt).
  blackout: true
  # Lichtblitz beim Einschlag.
  flash: true
  # Clientseitige Lichtquellen rund um das Zielgebiet.
  light: true
  sounds: true

aim:
  # Nach so vielen Ticks ohne Rechtsklick-Paket gilt die Taste als losgelassen.
  # Vanilla-Clients senden beim Halten alle 4 Ticks ein Paket.
  release-timeout-ticks: 8
  # Verlangsamung beim Zielen (0 = aus, 0.8 = 80 % langsamer). Erzeugt auch den leichten Zoom.
  slowdown: 0.8
  # Zielkoordinaten und Entfernung in der Aktionsleiste anzeigen.
  action-bar: true

recipe:
  enabled: true
  # Rezept beim Betreten des Servers im Rezeptbuch freischalten.
  discover-on-join: true

resource-pack:
  # Das Plugin erzeugt beim Start plugins/OrbitalRailgun/OrbitalRailgun-pack.zip.
  # Lade die Datei auf einen Webserver hoch und trage die direkte Download-URL hier ein.
  enabled: false
  url: ''
  # SHA-1 der hochgeladenen Datei. Leer lassen, wenn die erzeugte Datei unverändert hochgeladen wird.
  sha1: ''
  # true = Spieler, die das Pack ablehnen, werden getrennt.
  required: false
  prompt: 'Dieses Pack enthält das 3D-Modell und die Übersetzungen der Orbital Railgun.'
  # Grünen Visier-Rahmen beim Zielen einblenden (nur mit geladenem Pack).
  aim-overlay: true
